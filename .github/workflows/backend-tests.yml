name: Backend tests

on:
  push:
    branches:
      - main
      - phase5/desktop-automation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONFAULTHANDLER: "1"

jobs:
  collect:
    name: Collect backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --collect-only -q

  voice-integration:
    name: Voice integration diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run voice lifecycle and integration tests with per-test timeout
        run: >-
          python -m pytest
          tests/test_voice_engine_lifecycle.py
          tests/test_voice_engine_integration.py
          -vv --tb=long --timeout=30 --timeout-method=signal --durations=20 -ra

  backend-suite:
    name: Full backend pytest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Run full backend suite with per-test timeout and diagnostics
        run: >-
          python -m pytest
          -vv --tb=short --timeout=30 --timeout-method=signal --durations=25 -ra
