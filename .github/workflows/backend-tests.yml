name: Backend tests

on:
  push:
    branches:
      - main
      - phase5/desktop-automation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip

      - name: Install backend and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run focused diagnostic
        run: python -m pytest tests/test_main_composition.py -vv --tb=long
