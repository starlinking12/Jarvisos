[project]
name = "jarvis-backend"
version = "0.0.0"
description = "JARVIS OS AI backend — agents, memory, vision, voice, automation, planning."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "structlog>=24.2.0",
    "python-dotenv>=1.0.1",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "numpy>=1.26.0",
    "jarvis-contracts @ file:../../packages/contracts/python",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.1",
]
voice = [
    "sounddevice>=0.4.7",
    "webrtcvad>=2.0.10",
    "openwakeword>=0.6.0",
]
security = [
    "psutil>=6.0.0",
]
automation = [
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pywinauto>=0.6.8; platform_system == 'Windows'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis_backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_ollama: requires a real, reachable Ollama server (skipped by default)",
    "live_voice_hardware: requires real audio hardware/native voice deps (skipped by default)",
    "live_desktop: requires a real Windows desktop session and automation dependencies (skipped by default)",
]

[tool.mypy]
python_version = "3.11"
strict = true
